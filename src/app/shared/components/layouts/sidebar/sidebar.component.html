<ul class="sidebarlist">
  <ng-container *ngFor="let menulist of menuList; trackBy: trackById">
    <li class="nav-item" *ngIf="!menulist.children">
      <a
        [routerLink]="menulist.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
      >
        <i [class]="menulist.icon"></i>
        <span *ngIf="!isCollapsed">{{ menulist.title }}</span>
      </a>
    </li>
    <!-- Submenu logic -->
    <li class="nav-item" *ngIf="menulist.children">
      <a (click)="toggleSubMenu(menulist.id)" href="javascript:void(0)">
        <i [class]="menulist.icon"></i>
        <span *ngIf="!isCollapsed">{{ menulist.title }}</span>
        <span [ngClass]="{ open: isSubMenuOpen(menulist.id) }" *ngIf="!isCollapsed">
          <svg
            fill="#000000"
            version="1.1"
            id="Layer_1"
            xmlns="http://www.w3.org/2000/svg"
            xmlns:xlink="http://www.w3.org/1999/xlink"
            width="10px"
            height="10px"
            viewBox="0 0 100 100"
            enable-background="new 0 0 100 100"
            xml:space="preserve"
          >
            <g>
              <path
                d="M78.466,35.559L50.15,63.633L22.078,35.317c-0.777-0.785-2.044-0.789-2.828-0.012s-0.789,2.044-0.012,2.827L48.432,67.58
    c0.365,0.368,0.835,0.563,1.312,0.589c0.139,0.008,0.278-0.001,0.415-0.021c0.054,0.008,0.106,0.021,0.16,0.022
    c0.544,0.029,1.099-0.162,1.515-0.576l29.447-29.196c0.785-0.777,0.79-2.043,0.012-2.828S79.249,34.781,78.466,35.559z"
              />
            </g>
          </svg>
        </span>
      </a>
      <ul class="submenu" [ngClass]="{ open: isSubMenuOpen(menulist.id) }" *ngIf="!isCollapsed">
        <li class="nav-item" *ngFor="let child of menulist.children">
          <a
            [routerLink]="child.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: false }"
          >
            <i [class]="child.icon"></i>
            <span>{{ child.title }}</span>
          </a>
        </li>
      </ul>
    </li>
  </ng-container>
</ul>
