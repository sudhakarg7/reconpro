  <div class="container">
    <h2>Ask a Question</h2>
  
    <div>
      <input type="text" #queryInput placeholder="Enter your query" [(ngModel)]="queryInputs" />
      {{queryInputs}}
      <!-- <button (click)="startSseStreamFinal(queryInput.value, extractedText)">Ask</button> -->
      <button (click)="pingOllama()">Ask</button>
    </div>
  
    <div *ngIf="isLoading" class="loading">
      <p>Loading response...</p>
    </div>
  
    <div class="response">
      <h3>Ollama Response:</h3>
      <pre>{{ ollamaResponse$ | async |json }}</pre> <!-- Display the response here -->
    </div>
  </div>
